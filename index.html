<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>George Eliot Chronology</title>

    <script src="https://code.jquery.com/jquery-1.10.2.js"></script>
	
    <link href="bootstrap.css" rel="stylesheet" /> 
    <script type="text/javascript" src="bootstrap.min.js"></script> 
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.5/d3.min.js"></script>
    <style>
    html, body { margin: 0; min-width: 0; }
    .calender-map svg { display: block; }
    #citation-results { overflow-wrap: anywhere; }
	.calender-map {
      font: 10px sans-serif;
      shape-rendering: crispEdges;
    }
    .day {
      stroke: #666;
    }
    .month {
      fill: none;
      stroke: #000;
      stroke-width: 2px;
    }
    .RdYlGn .q0-11{fill:rgb(165,0,38)}
    .RdYlGn .q1-{fill:rgb(215,48,39)}
    .RdYlGn .q2-11{fill:rgb(244,109,67)}
    .RdYlGn .q3-11{fill:rgb(253,174,97)}
    .RdYlGn .q4-11{fill:rgb(254,224,139)}
    .RdYlGn .q5-11{fill:rgb(255,255,191)}
    .RdYlGn .q6-11{fill:rgb(217,239,139)}
    .RdYlGn .q7-11{fill:rgb(166,217,106)}
    .RdYlGn .q8-11{fill:rgb(102,189,99)}
    .RdYlGn .q9-11{fill:rgb(26,152,80)}
    .RdYlGn .q10-11{fill:rgb(0,104,55)}
    </style>
</head>
<body>
  <input type="text" placeholder="Search..." id="myInput">
    <button type="button" onclick="searchCalendar();">Search</button>
<div> 
  <h1 class="name">George Eliot Chronology</h1>
</div>
<!-- ADDED: stable results area so citation links can be clicked. -->
<section id="citation-results" aria-live="polite" style="background:white;color:black;margin:16px;padding:12px;max-height:240px;overflow:auto">Search or click a colored date to view source links.</section>
<div class="calender-map"></div>
<!-- ADDED: configurable destinations and citation helpers, loaded before the calendar. -->
<script src="citation-config.js?build=letter-titles-5"></script>
<script src="citation-links.js?build=letter-titles-5"></script>
<script type="text/javascript" src="calendermap.js?build=letter-titles-5"></script>
</body></html>
